# Search + matching profile. Replace these values with your own.
name: "Jordan Lee"
resume: "config/resume.md"

target_titles:
  - "Backend Engineer"
  - "Senior Backend Engineer"
  - "Platform Engineer"
  - "Software Engineer, Infrastructure"

# Keywords used for scoring job fit. Case-insensitive substring match
# against the job title + description.
keywords:
  - python
  - go
  - golang
  - kubernetes
  - distributed systems
  - postgres
  - kafka
  - aws
  - terraform
  - grpc
  - microservice

locations:
  - "Remote"
  - "Berlin"
  - "Zurich"

# A job is drafted only if it scores at least this many keyword matches.
# Raise this to be more selective, lower it to see more candidates.
min_match_score: 2

# Best-effort salary floor, in thousands, currency-agnostic (a listing in
# EUR/CHF/USD is treated the same — close enough for filtering purposes,
# not for real compensation comparison). Jobs with a parseable salary below
# this are excluded outright, even if they score well on keywords. Most
# EU/Swiss listings (EPO included) don't publish a number at all — those are
# scored on keywords only, with salary marked "unknown" in the output so a
# human can check.
min_salary_k: 130
