<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAN 2.7 Video Edit</title>
    <link rel="stylesheet" href="/shared/nav.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #09090f; }
        video, img.result { max-width: 100%; border-radius: 0.75rem; }
        .btn-mode { transition: background 0.15s; }
        .btn-mode.active { background: #2563eb; }
        .btn-mode:not(.active) { background: #27272a; }
        #log { font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body class="text-gray-100 min-h-screen p-4 sm:p-6">
    <div class="max-w-xl mx-auto flex flex-col gap-5">

        <div class="flex items-center justify-between pt-2">
            <div>
                <h1 class="text-xl font-bold tracking-tight">WAN 2.7 Video Edit</h1>
                <p class="text-xs text-gray-500 mt-0.5">Generate & edit videos via Poe</p>
            </div>
            <button onclick="document.getElementById('settings').classList.toggle('hidden')"
                class="text-gray-400 hover:text-white text-lg px-2">⚙️</button>
        </div>

        <!-- Settings -->
        <div id="settings" class="hidden bg-zinc-900 rounded-xl p-4 flex flex-col gap-3 border border-zinc-800">
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Poe API Key</label>
                <input id="apiKey" type="password" placeholder="Paste your Poe API key"
                    autocomplete="off" spellcheck="false"
                    class="bg-zinc-800 rounded-lg px-3 py-2 text-sm outline-none border border-zinc-700 focus:border-zinc-500"
                    oninput="localStorage.setItem('poe_api_key', this.value)">
                <p class="text-xs text-gray-600">Get your key at
                    <a href="https://poe.com/api_key" target="_blank" class="text-blue-500 hover:underline">poe.com/api_key</a>
                </p>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Bot Name</label>
                <input id="botName" type="text" value="wan-2.7"
                    class="bg-zinc-800 rounded-lg px-3 py-2 text-sm outline-none border border-zinc-700 focus:border-zinc-500"
                    oninput="localStorage.setItem('poe_bot_name', this.value)">
                <p class="text-xs text-gray-600">The Poe bot name for the WAN 2.7 model</p>
            </div>
        </div>

        <!-- Mode selector -->
        <div class="flex gap-2">
            <button id="btn-generate" class="btn-mode active flex-1 py-2 rounded-lg text-sm font-medium"
                onclick="setMode('generate')">🎬 Text to Video</button>
            <button id="btn-edit" class="btn-mode flex-1 py-2 rounded-lg text-sm font-medium"
                onclick="setMode('edit')">✂️ Edit Video</button>
        </div>

        <!-- Source video URL (edit mode only) -->
        <div id="sourceSection" class="hidden flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Source Video URL</label>
            <input id="videoUrl" type="url" placeholder="https://example.com/video.mp4"
                class="bg-zinc-900 rounded-lg px-3 py-2 text-sm outline-none border border-zinc-800 focus:border-zinc-600">
            <p class="text-xs text-gray-600">Direct URL to the video you want to edit</p>
        </div>

        <!-- Prompt -->
        <div class="flex flex-col gap-1.5">
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Prompt</label>
            <textarea id="prompt" rows="4"
                placeholder="Describe the video to generate..."
                class="bg-zinc-900 rounded-lg px-3 py-2 text-sm outline-none border border-zinc-800 focus:border-zinc-600 resize-none"></textarea>
        </div>

        <!-- Submit -->
        <button id="submitBtn" onclick="submit()"
            class="py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-xl font-semibold text-sm transition">
            Generate
        </button>

        <!-- Output -->
        <div id="output" class="hidden bg-zinc-900 rounded-xl border border-zinc-800 overflow-hidden">
            <div id="statusBar" class="px-4 py-2 bg-zinc-800 text-xs text-gray-400 flex items-center gap-2">
                <span id="statusIcon">⏳</span>
                <span id="statusText">Connecting…</span>
            </div>
            <div class="p-4 flex flex-col gap-3">
                <div id="responseText" class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed"></div>
                <video id="outputVideo" controls class="hidden w-full"></video>
                <img id="outputImage" class="result hidden w-full">
                <div id="attachmentLinks" class="flex flex-col gap-1 text-xs"></div>
            </div>
        </div>

    </div>

    <script src="/shared/nav.js"></script>
    <script>
        let mode = 'generate';

        document.getElementById('apiKey').value = localStorage.getItem('poe_api_key') || '';
        const savedBot = localStorage.getItem('poe_bot_name');
        if (savedBot) document.getElementById('botName').value = savedBot;

        function setMode(m) {
            mode = m;
            document.getElementById('btn-generate').classList.toggle('active', m === 'generate');
            document.getElementById('btn-edit').classList.toggle('active', m === 'edit');
            document.getElementById('sourceSection').classList.toggle('hidden', m !== 'edit');
            document.getElementById('submitBtn').textContent = m === 'generate' ? 'Generate' : 'Edit Video';
            document.getElementById('prompt').placeholder = m === 'generate'
                ? 'Describe the video to generate…'
                : 'Describe how to edit the video…';
        }

        function setStatus(icon, text) {
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusText').textContent = text;
        }

        async function submit() {
            const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('poe_api_key') || '';
            const botName = document.getElementById('botName').value.trim() || 'wan-2.7';
            const promptText = document.getElementById('prompt').value.trim();
            const videoUrl = document.getElementById('videoUrl').value.trim();

            if (!apiKey) {
                document.getElementById('settings').classList.remove('hidden');
                document.getElementById('apiKey').focus();
                return;
            }
            if (!promptText) {
                document.getElementById('prompt').focus();
                return;
            }
            if (mode === 'edit' && !videoUrl) {
                document.getElementById('videoUrl').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Processing…';

            const output = document.getElementById('output');
            output.classList.remove('hidden');
            document.getElementById('responseText').textContent = '';
            document.getElementById('outputVideo').classList.add('hidden');
            document.getElementById('outputImage').classList.add('hidden');
            document.getElementById('attachmentLinks').innerHTML = '';
            setStatus('⏳', 'Connecting to Poe…');

            try {
                const message = {
                    role: 'user',
                    content: promptText,
                    content_type: 'text/plain',
                    timestamp: Date.now() * 1000,
                    message_id: `msg-${crypto.randomUUID()}`,
                    feedback: [],
                    attachments: mode === 'edit' && videoUrl ? [{
                        url: videoUrl,
                        content_type: 'video/mp4',
                        name: 'source.mp4'
                    }] : []
                };

                const resp = await fetch(`https://api.poe.com/bot/${encodeURIComponent(botName)}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        version: '1',
                        type: 'query',
                        query: [message],
                        user_id: '',
                        conversation_id: `conv-${crypto.randomUUID()}`,
                        message_id: `msgid-${crypto.randomUUID()}`
                    })
                });

                if (!resp.ok) {
                    const errBody = await resp.text().catch(() => '');
                    throw new Error(`HTTP ${resp.status}${errBody ? ': ' + errBody : ''}`);
                }

                setStatus('🎬', 'Generating…');

                const reader = resp.body.getReader();
                const dec = new TextDecoder();
                let buf = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });

                    const lines = buf.split('\n');
                    buf = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const raw = line.slice(6).trim();
                        if (!raw || raw === '[DONE]') continue;
                        let ev;
                        try { ev = JSON.parse(raw); } catch { continue; }
                        handleEvent(ev);
                    }
                }

                setStatus('✅', 'Done');
            } catch (err) {
                setStatus('❌', err.message);
                if (err.message.includes('Failed to fetch') || err.message.includes('CORS')) {
                    document.getElementById('responseText').textContent =
                        'The Poe API may not support direct browser requests (CORS). ' +
                        'Try running this via a local proxy or server-side script.';
                }
            } finally {
                btn.disabled = false;
                btn.textContent = mode === 'generate' ? 'Generate' : 'Edit Video';
            }
        }

        function handleEvent(ev) {
            const responseText = document.getElementById('responseText');
            const outputVideo = document.getElementById('outputVideo');
            const outputImage = document.getElementById('outputImage');
            const attachmentLinks = document.getElementById('attachmentLinks');

            if (ev.type === 'text') {
                responseText.textContent += ev.text ?? '';
            } else if (ev.type === 'replace_response') {
                responseText.textContent = ev.text ?? '';
            } else if (ev.type === 'file_attachment') {
                const att = ev.attachment ?? {};
                const ct = att.content_type ?? '';
                const url = att.url ?? '';
                if (!url) return;
                if (ct.startsWith('video/')) {
                    outputVideo.src = url;
                    outputVideo.classList.remove('hidden');
                } else if (ct.startsWith('image/')) {
                    outputImage.src = url;
                    outputImage.classList.remove('hidden');
                } else {
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.textContent = `⬇️ Download: ${att.name || url}`;
                    a.className = 'text-blue-400 hover:underline';
                    attachmentLinks.appendChild(a);
                }
            } else if (ev.type === 'done') {
                setStatus('✅', 'Done');
            } else if (ev.type === 'error') {
                setStatus('❌', ev.text ?? 'Error from bot');
            }
        }
    </script>
</body>
</html>
